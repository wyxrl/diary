
name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Debug build output
        if: always()
        run: |
          echo "=== Root directory ==="
          ls -la

          echo "=== public directory ==="
          ls -la public || true

          echo "=== HTML/XML files in public ==="
          find public -maxdepth 5 -type f \( -name '*.html' -o -name '*.xml' \) | head -100 || true

          echo "=== index.html files in repository ==="
          find . -maxdepth 5 -type f -name 'index.html' -not -path './node_modules/*' | head -100 || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

